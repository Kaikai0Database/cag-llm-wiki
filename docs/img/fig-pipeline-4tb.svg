<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="t">
<title id="t">4TB 血管造影 DICOM 資料管線：五步驟與 checkpoint</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf"/></marker>
<style>
svg{background:#fff}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#2a2020;text-anchor:middle}
.m{fill:#6f6463}.a{fill:#b3261e}.ok{fill:#2f7a4a}.b{font-weight:700}.s{text-anchor:start}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.surf{fill:#fff;stroke:#ddd5d3;stroke-width:1.5}.box{fill:#f4f0ef;stroke:#ddd5d3;stroke-width:1.5}
.abox{fill:#fbe9e7;stroke:#b3261e;stroke-width:1.5}.okbox{fill:#e3f3e8;stroke:#2f7a4a;stroke-width:1.5}
.badge{fill:#fbe9e7}.ln{fill:none;stroke:#8f8381;stroke-width:1.5}.lnd{fill:none;stroke:#8f8381;stroke-width:1.5;stroke-dasharray:3 4}
.arrow{fill:none;stroke:#6f6463;stroke-width:2;marker-end:url(#ah)}.ahf{fill:#6f6463}
.loop{fill:none;stroke:#2f7a4a;stroke-width:2.5;marker-end:url(#ag)}.agf{fill:#2f7a4a}
.chev{fill:none;stroke:#8f8381;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){svg{background:oklch(0.21 0.008 25)}text{fill:#f0eaea}.m{fill:#b9adac}.a{fill:#ff8a80}.ok{fill:#8fd6a5}.surf{fill:#211b1a;stroke:#463c3b}.box{fill:#2d2625;stroke:#463c3b}.abox{fill:#4a2523;stroke:#ff8a80}.okbox{fill:#1f3a28;stroke:#8fd6a5}.badge{fill:#4a2523}.ln,.lnd,.chev{stroke:#8a7e7d}.arrow{stroke:#b9adac}.ahf{fill:#b9adac}.loop{stroke:#8fd6a5}.agf{fill:#8fd6a5}}
</style>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="agf"/></marker>
</defs>
<path class="box" d="M38,26 V62 A38,10 0 0 0 114,62 V26 A38,10 0 0 0 38,26 Z"/>
<ellipse class="box" cx="76" cy="26" rx="38" ry="10"/>
<text class="b" x="76" y="56" font-size="15">4TB</text>
<text class="m s" x="128" y="44" font-size="12.5">血管造影 DICOM 原始資料</text>
<path class="arrow" d="M76,76 V104"/>

<g>
<rect class="surf" x="20" y="108" width="112" height="104" rx="12"/>
<rect class="surf" x="142" y="108" width="112" height="104" rx="12"/>
<rect class="surf" x="264" y="108" width="112" height="104" rx="12"/>
<rect class="abox" x="386" y="108" width="112" height="104" rx="12"/>
<rect class="surf" x="508" y="108" width="112" height="104" rx="12"/>
</g>
<g class="b" font-size="12">
<circle class="badge" cx="76" cy="132" r="12"/><text class="a" x="76" y="136">1</text>
<circle class="badge" cx="198" cy="132" r="12"/><text class="a" x="198" y="136">2</text>
<circle class="badge" cx="320" cy="132" r="12"/><text class="a" x="320" y="136">3</text>
<circle class="badge" cx="442" cy="132" r="12"/><text class="a" x="442" y="136">4</text>
<circle class="badge" cx="564" cy="132" r="12"/><text class="a" x="564" y="136">5</text>
</g>
<g class="b" font-size="14">
<text x="76" y="170">建立清單</text><text x="198" y="170">只讀標頭</text><text x="320" y="170">篩出 XA</text>
<text x="442" y="170">去識別化</text><text x="564" y="170">轉存分片</text>
</g>
<text class="m" x="76" y="193" font-size="10.5">路徑 · 大小 · 雜湊</text>
<text class="m mono" x="198" y="193" font-size="9.5">stop_before_pixels</text>
<text class="m mono" x="320" y="193" font-size="10">SOP Class UID</text>
<text class="m mono" x="442" y="193" font-size="10">PS3.15 Annex E</text>
<text class="m mono" x="564" y="193" font-size="10">shards</text>
<path class="chev" d="M134,154 L140,160 L134,166 M256,154 L262,160 L256,166 M378,154 L384,160 L378,166 M500,154 L506,160 L500,166"/>

<path class="lnd" d="M76,212 V240 M198,212 V240 M320,212 V240 M442,212 V240 M564,212 V240"/>
<rect class="okbox" x="20" y="240" width="600" height="56" rx="14"/>
<path class="loop" d="M60,256 A12,12 0 1 1 46,270"/>
<text class="b ok s" x="84" y="264" font-size="13.5">每步寫入完成紀錄（checkpoint）</text>
<text class="m s" x="84" y="284" font-size="11.5">中斷後可續跑 · 多行程平行處理</text>
</svg>
