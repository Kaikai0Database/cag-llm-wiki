<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="t">
<title id="t">QCA：RVD、MLD、病灶長度與 %DS 公式</title>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="adf"/></marker>
<style>
svg{background:#fff}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#2a2020;text-anchor:middle}
.m{fill:#6f6463}.a{fill:#b3261e}.b{font-weight:700}
.wall{fill:#efe7e5}.lumen{fill:#b3261e}.abox{fill:#fbe9e7;stroke:#b3261e;stroke-width:1.5}
.dim{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round}.adf{fill:#fff}
.ln{fill:none;stroke:#8f8381;stroke-width:1.5}
@media (prefers-color-scheme:dark){svg{background:oklch(0.21 0.008 25)}text{fill:#f0eaea}.m{fill:#b9adac}.a{fill:#ff8a80}.wall{fill:#3a3130}.lumen{fill:#ff8a80}.abox{fill:#4a2523;stroke:#ff8a80}.dim{stroke:#2a1513}.adf{fill:#2a1513}.ln{stroke:#8a7e7d}}
</style>
</defs>
<text class="b" x="320" y="38" font-size="14">MLD</text>
<text class="m" x="320" y="56" font-size="11.5">最小管腔直徑</text>
<path class="ln" d="M320,64 V146"/>

<rect class="wall" x="40" y="108" width="560" height="104" rx="8"/>
<path class="lumen" d="M40,120 H220 C270,120 290,150 320,150 C350,150 370,120 420,120 H600 V200 H420 C370,200 350,170 320,170 C290,170 270,200 220,200 H40 Z"/>
<path class="dim" d="M120,126 V194" marker-start="url(#ad)" marker-end="url(#ad)"/>
<path class="dim" d="M310,152 H330 M320,152 V168 M310,168 H330"/>

<text class="b" x="120" y="238" font-size="14">RVD</text>
<text class="m" x="120" y="256" font-size="11.5">參考血管直徑</text>
<path class="ln" d="M220,220 V230 H420 V220"/>
<text class="m" x="320" y="250" font-size="12">病灶長度</text>

<rect class="abox" x="110" y="284" width="420" height="66" rx="14"/>
<text class="b" x="320" y="325" font-size="21"><tspan class="a">%DS</tspan> = (1 − MLD / RVD) × 100</text>
</svg>
