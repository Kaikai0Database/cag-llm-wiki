<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t">
<title id="t">深度學習 QCA 五步驟與評估指標</title>
<defs>
<style>
svg{background:#fff}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#2a2020;text-anchor:middle}
.m{fill:#6f6463}.a{fill:#b3261e}.b{font-weight:700}.s{text-anchor:start}
.surf{fill:#fff;stroke:#ddd5d3;stroke-width:1.5}.box{fill:#f4f0ef;stroke:#ddd5d3;stroke-width:1.5}
.abox{fill:#fbe9e7;stroke:#b3261e;stroke-width:1.5}.dark{fill:#2a2020}.lumen{fill:#b3261e}
.vw{fill:none;stroke:#fff;stroke-linecap:round}.v{fill:none;stroke:#b3261e;stroke-width:4;stroke-linecap:round}
.g{fill:none;stroke:#2f7a4a;stroke-width:4;stroke-linecap:round}.y{fill:none;stroke:#c08a2a;stroke-width:4;stroke-linecap:round}
.cl{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:4 3}.bb{fill:none;stroke:#c08a2a;stroke-width:2;stroke-dasharray:4 3}
.chev{fill:none;stroke:#8f8381;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){svg{background:oklch(0.21 0.008 25)}text{fill:#f0eaea}.m{fill:#b9adac}.a{fill:#ff8a80}.surf{fill:#211b1a;stroke:#463c3b}.box{fill:#2d2625;stroke:#463c3b}.abox{fill:#4a2523;stroke:#ff8a80}.dark{fill:#0e0a0a}.lumen{fill:#ff8a80}.v{stroke:#ff8a80}.g{stroke:#8fd6a5}.y{stroke:#ffc56b}.cl{stroke:#2a1513}.bb{stroke:#ffc56b}.chev{stroke:#8a7e7d}}
</style>
</defs>
