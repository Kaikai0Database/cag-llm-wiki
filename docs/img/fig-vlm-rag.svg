<style>
svg{background:#fff}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#2a2020;text-anchor:middle}
.m{fill:#6f6463}.a{fill:#b3261e}.ok{fill:#2f7a4a}.b{font-weight:700}.s{text-anchor:start}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.surf{fill:#fff;stroke:#ddd5d3;stroke-width:1.5}.box{fill:#f4f0ef;stroke:#ddd5d3;stroke-width:1.5}
.abox{fill:#fbe9e7;stroke:#b3261e;stroke-width:1.5}.okbox{fill:#e3f3e8;stroke:#2f7a4a;stroke-width:1.5}
