.arrow{fill:none;stroke:#6f6463;stroke-width:2;marker-end:url(#ah)}.ahf{fill:#6f6463}
@media (prefers-color-scheme:dark){svg{background:oklch(0.21 0.008 25)}text{fill:#f0eaea}.m{fill:#b9adac}.a{fill:#ff8a80}.ok{fill:#8fd6a5}.surf{fill:#211b1a;stroke:#463c3b}.box{fill:#2d2625;stroke:#463c3b}.abox{fill:#4a2523;stroke:#ff8a80}.okbox{fill:#1f3a28;stroke:#8fd6a5}.frame{fill:#0e0a0a}.doc{stroke:#6d6160}.arrow{stroke:#b9adac}.ahf{fill:#b9adac}}
</style>
</defs>
