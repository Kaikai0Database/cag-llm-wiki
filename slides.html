  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" id="brand" href="index.html">CAG AI 知識庫</a>
      <nav class="nav" id="nav" aria-label="主選單">

  <main class="container" id="main">
    <div class="deck-bar">
      <button class="btn ghost" id="prev" type="button" aria-label="上一張">← 上一張</button>
      <span class="tag" id="counter" aria-live="polite">0 / 0</span>
      <progress id="progress" max="1" value="0"></progress>
      <button class="btn" id="next" type="button" aria-label="下一張">下一張 →</button>
    </div>
    <div id="stage"></div>
    <p class="small">鍵盤：← → 換頁，Home / End 跳到頭尾。每個重點後面的標籤是 Wiki 引用段落，點了可以核對原文。</p>
  </main>

  <script src="common.js"></script>
