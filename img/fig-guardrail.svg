<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="t">
<title id="t">防幻覺檢查關卡：引用、數字、語意，任一不過就剔除</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf"/></marker>
<style>
svg{background:#fff}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#2a2020;text-anchor:middle}
.m{fill:#6f6463}.a{fill:#b3261e}.ok{fill:#2f7a4a}.wn{fill:#8a5a00}.b{font-weight:700}.s{text-anchor:start}
.surf{fill:#fff;stroke:#ddd5d3;stroke-width:1.5}.abox{fill:#fbe9e7;stroke:#b3261e;stroke-width:1.5}
.okbox{fill:#e3f3e8;stroke:#2f7a4a;stroke-width:1.5}.wbox{fill:#fff1d6;stroke:#c08a2a;stroke-width:1.5}
.arrow{fill:none;stroke:#6f6463;stroke-width:2;marker-end:url(#ah)}.ahf{fill:#6f6463}
.back{fill:none;stroke:#8f8381;stroke-width:1.8;stroke-dasharray:5 4;marker-end:url(#ah)}
@media (prefers-color-scheme:dark){svg{background:oklch(0.21 0.008 25)}text{fill:#f0eaea}.m{fill:#b9adac}.a{fill:#ff8a80}.ok{fill:#8fd6a5}.wn{fill:#ffc56b}.surf{fill:#211b1a;stroke:#463c3b}.abox{fill:#4a2523;stroke:#ff8a80}.okbox{fill:#1f3a28;stroke:#8fd6a5}.wbox{fill:#3d2f12;stroke:#ffc56b}.arrow{stroke:#b9adac}.ahf{fill:#b9adac}.back{stroke:#8a7e7d}}
</style>
</defs>
<rect class="surf" x="20" y="60" width="100" height="70" rx="12"/>
<text class="b" x="70" y="91" font-size="13.5">LLM 重點</text><text class="m" x="70" y="112" font-size="10.5">附段落編號</text>

<rect class="abox" x="150" y="60" width="110" height="70" rx="12"/>
<text class="b" x="205" y="91" font-size="13.5">引用存在？</text><text class="m" x="205" y="112" font-size="10.5">本節檢索段落</text>
<rect class="abox" x="280" y="60" width="110" height="70" rx="12"/>
<text class="b" x="335" y="91" font-size="13.5">數字在原文？</text><text class="m" x="335" y="112" font-size="10.5">規則檢查</text>
<rect class="abox" x="410" y="60" width="110" height="70" rx="12"/>
<text class="b" x="465" y="91" font-size="13.5">語意被支持？</text><text class="m" x="465" y="112" font-size="10.5">LLM 審查員</text>
<rect class="okbox" x="540" y="60" width="80" height="70" rx="12"/>
<text class="b ok" x="580" y="91" font-size="15">保留</text><text class="m" x="580" y="112" font-size="10.5">進簡報</text>

<path class="arrow" d="M120,95 H146"/><path class="arrow" d="M260,95 H276"/><path class="arrow" d="M390,95 H406"/><path class="arrow" d="M520,95 H536"/>
<g class="m" font-size="11"><text x="268" y="84">是</text><text x="398" y="84">是</text><text x="528" y="84">是</text></g>

<path class="arrow" d="M205,130 V180"/><path class="arrow" d="M335,130 V180"/><path class="arrow" d="M465,130 V180"/>
<g class="m s" font-size="11"><text x="211" y="160">否</text><text x="341" y="160">否</text><text x="471" y="160">否</text></g>
<rect class="wbox" x="150" y="184" width="370" height="60" rx="12"/>
<text class="b wn" x="335" y="210" font-size="14">剔除（fail closed）</text>
<text class="m" x="335" y="231" font-size="11">原因寫進檢核報告</text>

<path class="back" d="M150,214 H70 V134"/>
<text class="m s" x="20" y="280" font-size="11.5">通過率 &lt; 60% → 帶著剔除原因重新整理（最多 2 輪）</text>

<path class="arrow" d="M580,130 V180"/>
<rect class="okbox" x="532" y="184" width="88" height="60" rx="12"/>
<text class="b ok" x="576" y="210" font-size="13">醫師審閱</text><text class="m" x="576" y="231" font-size="10.5">最終簽署</text>
</svg>
