<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" role="img" aria-labelledby="t">
<title id="t">依阻塞性 CAD 臨床可能性選擇初始檢查</title>
<defs>
<clipPath id="bar"><rect x="20" y="166" width="600" height="54" rx="12"/></clipPath>
<style>
svg{background:#fff}
text{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;fill:#2a2020;text-anchor:middle}
.m{fill:#6f6463}.b{font-weight:700}.w{fill:#fff}.s{text-anchor:start}
.box{fill:#f4f0ef;stroke:#ddd5d3;stroke-width:1.5}.abox{fill:#fbe9e7;stroke:#b3261e;stroke-width:1.5}
.seg{fill:#b3261e}.ln{fill:none;stroke:#8f8381;stroke-width:1.5}
@media (prefers-color-scheme:dark){svg{background:oklch(0.21 0.008 25)}text{fill:#f0eaea}.m{fill:#b9adac}.w{fill:#2a1513}.box{fill:#2d2625;stroke:#463c3b}.abox{fill:#4a2523;stroke:#ff8a80}.seg{fill:#ff8a80}.ln{stroke:#8a7e7d}}
</style>
</defs>
<text class="m s" x="20" y="30" font-size="13">阻塞性 CAD 的臨床可能性（RF-CL，可再以 CACS 調整）</text>

<rect class="box" x="300" y="52" width="200" height="66" rx="12"/>
<text class="b" x="400" y="80" font-size="15">功能性影像</text>
<text class="m" x="400" y="103" font-size="11.5">壓力心超 · SPECT · PET · CMR</text>
<path class="ln" d="M400,118 V146 M300,156 V146 H500 V156"/>

<g clip-path="url(#bar)">
<rect class="seg" x="20" y="166" width="120" height="54" fill-opacity=".12"/>
<rect class="seg" x="140" y="166" width="120" height="54" fill-opacity=".26"/>
<rect class="seg" x="260" y="166" width="120" height="54" fill-opacity=".45"/>
<rect class="seg" x="380" y="166" width="120" height="54" fill-opacity=".72"/>
<rect class="seg" x="500" y="166" width="120" height="54"/>
</g>
<text class="b" x="80" y="190" font-size="14">極低</text><text x="80" y="209" font-size="12">≤5%</text>
<text class="b" x="200" y="190" font-size="14">低</text><text x="200" y="209" font-size="12">&gt;5–15%</text>
<text class="b" x="320" y="190" font-size="14">中</text><text x="320" y="209" font-size="12">&gt;15–50%</text>
<text class="b w" x="440" y="190" font-size="14">高</text><text class="w" x="440" y="209" font-size="12">&gt;50–85%</text>
<text class="b w" x="560" y="190" font-size="14">極高</text><text class="w" x="560" y="209" font-size="12">&gt;85%</text>

<path class="ln" d="M24,230 V240 H136 V230 M80,240 V262"/>
<path class="ln" d="M144,230 V240 H376 V230 M260,240 V262"/>
<path class="ln" d="M504,230 V240 H616 V230 M560,240 V262"/>

<rect class="box" x="25" y="262" width="110" height="66" rx="12"/>
<text class="b" x="80" y="290" font-size="15">延後檢查</text>
<text class="m" x="80" y="312" font-size="11.5">多數可延後</text>

<rect class="box" x="180" y="262" width="160" height="66" rx="12"/>
<text class="b" x="260" y="290" font-size="15">CCTA</text>
<text class="m" x="260" y="312" font-size="11.5">優先排除阻塞性 CAD</text>

<rect class="abox" x="505" y="262" width="110" height="66" rx="12"/>
<text class="b" x="560" y="290" font-size="15">直接 ICA</text>
<text class="m" x="560" y="312" font-size="11.5">侵入性造影</text>
</svg>
